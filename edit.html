<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Jarvis data</title>
<style>
body{font-family:Helvetica,Arial,sans-serif;background:#0B0B0C;color:#F5F5F0;margin:0;padding:16px;font-size:18px}
h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;color:#D6FF00;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.08em}
label{display:block;padding:10px 0;border-bottom:1px solid #2a2a2a}
input[type=text],input[type=number]{background:#151517;color:#F5F5F0;border:1px solid #555;padding:8px;font-size:18px;width:100%;box-sizing:border-box}
input[type=checkbox]{width:28px;height:28px;vertical-align:middle;margin-right:10px}
.n{width:90px!important;display:inline-block}
button{background:#D6FF00;color:#0B0B0C;border:0;padding:12px 18px;font-size:18px;font-weight:bold;margin:6px 6px 6px 0;border-radius:6px}
textarea{width:100%;height:220px;background:#151517;color:#F5F5F0;font-family:monospace;font-size:13px;box-sizing:border-box}
.hint{color:#A8A8A0;font-size:15px}
</style></head><body>
<h1>Jarvis screen: edit data</h1>
<p class="hint">Changes save in this browser. To update the TV, press "Download data.json" (or copy the JSON) and replace data.json in the jarvis-screen folder. Money and streak numbers can also come from Excel via sync_from_excel.py.</p>
<div id="f">Loading data.json...</div>
<h2>Save</h2>
<button onclick="dl()">Download data.json</button><button onclick="cp()">Copy JSON</button><button onclick="resetLocal()">Reload from file</button>
<textarea id="out"></textarea>
<script>
var D=null;
function load(){var x=new XMLHttpRequest();x.open('GET','data.json?t='+Date.now(),true);x.onload=function(){
 var saved=localStorage.getItem('jarvisData');D=saved?JSON.parse(saved):JSON.parse(x.responseText);draw();};
 x.onerror=function(){var s=localStorage.getItem('jarvisData');if(s){D=JSON.parse(s);draw();}else document.getElementById('f').innerHTML='Could not load data.json';};x.send();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function draw(){var h='',i;
 h+='<h2>Daily checklist</h2>';
 for(i=0;i<D.checklist.length;i++)h+='<label><input type="checkbox" data-k="c'+i+'" '+(D.checklist[i].done?'checked':'')+'><input type="text" data-k="ct'+i+'" value="'+esc(D.checklist[i].text)+'" style="width:75%"></label>';
 h+='<h2>Points (day max '+D.points.dayMax+')</h2>';
 ['today','week','month'].forEach(function(k){h+='<label>'+k+' <input class="n" type="number" data-k="p_'+k+'" value="'+(D.points[k]||0)+'"></label>';});
 h+='<label>Streak days <input class="n" type="number" data-k="streak" value="'+((D.streak&&D.streak.streak_current)||0)+'"></label>';
 h+='<h2>Courses (check when done)</h2>';
 for(i=0;i<D.courses.length;i++)h+='<label><input type="checkbox" data-k="co'+i+'" '+(D.courses[i].done?'checked':'')+'>'+esc(D.courses[i].name)+' <span class="hint">'+D.courses[i].hours+' h, '+esc(D.courses[i].targetMonth)+'</span></label>';
 h+='<h2>Money (blank = EDIT ME on TV)</h2>';
 D.money.goals.forEach(function(g,j){h+='<label>'+esc(g.label)+' <input class="n" type="number" data-k="mg'+j+'" value="'+(g.current==null?'':g.current)+'"></label>';});
 D.money.balances.forEach(function(b,j){h+='<label>'+esc(b.label)+' <input class="n" type="number" data-k="mb'+j+'" value="'+(b.value==null?'':b.value)+'"></label>';});
 h+='<label>As of (YYYY-MM-DD) <input type="text" data-k="asof" value="'+esc(D.money.asOf)+'"></label>';
 h+='<h2>Mantras (one per line)</h2><textarea data-k="quotes" style="height:140px">'+esc(D.quotes.join('\n'))+'</textarea>';
 document.getElementById('f').innerHTML=h;
 var els=document.querySelectorAll('[data-k]');for(i=0;i<els.length;i++){els[i].onchange=save;els[i].oninput=save;}
 save();}
function v(k){return document.querySelector('[data-k="'+k+'"]');}
function nv(k){var s=v(k).value;return s===''?null:Number(s);}
function save(){var i;
 for(i=0;i<D.checklist.length;i++){D.checklist[i].done=v('c'+i).checked;D.checklist[i].text=v('ct'+i).value;}
 ['today','week','month'].forEach(function(k){D.points[k]=Math.min(k=='today'?D.points.dayMax:99999,nv('p_'+k)||0);});
 D.streak=D.streak||{};D.streak.streak_current=nv('streak')||0;
 for(i=0;i<D.courses.length;i++)D.courses[i].done=v('co'+i).checked;
 D.money.goals.forEach(function(g,j){g.current=nv('mg'+j);});D.money.balances.forEach(function(b,j){b.value=nv('mb'+j);});
 D.money.asOf=v('asof').value||null;
 D.quotes=v('quotes').value.split('\n').filter(function(s){return s.trim();});
 var j=JSON.stringify(D,null,2);document.getElementById('out').value=j;localStorage.setItem('jarvisData',j);}
function dl(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.getElementById('out').value],{type:'application/json'}));a.download='data.json';a.click();}
function cp(){var t=document.getElementById('out');t.select();document.execCommand('copy');alert('Copied');}
function resetLocal(){localStorage.removeItem('jarvisData');load();}
load();
</script></body></html>
